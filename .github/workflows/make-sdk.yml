name: Make SDK (reusable)
on:
  workflow_call:
    inputs:
      platform:
        description: "linux | bionic | macos | windows | bsd"
        required: true
        type: string
      targets:
        description: "JSON array of target triples"
        required: true
        type: string
      only:
        description: "JSON array replacing targets, when set"
        required: false
        type: string
        default: ""
      tag:
        description: "AOSP source tag (android-* or platform-tools-*)"
        required: true
        type: string
      build_tools_version:
        description: "Exact official Build Tools version"
        required: false
        type: string
        default: ""
      platform_apis:
        description: "Android Platform API levels (space separated)"
        required: false
        type: string
        default: "34 35 36"
      ndk_version:
        description: "Official NDK version for the bionic clang (bionic only)"
        required: false
        type: string
        default: ""
      ndk_revision:
        description: "Official NDK revision letter (bionic only)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.only != '' && inputs.only || inputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /mnt

      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          sudo rsync -aqP /var/lib/docker/ /mnt/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - name: Prepare /mnt/build
        run: |
          sudo mkdir -p /mnt/build
          sudo chown $(id -u):$(id -g) /mnt/build
          rmdir "$GITHUB_WORKSPACE"
          ln -s /mnt/build "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make SDK
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sdk-builder:latest"
          docker run --rm \
            -v "/mnt/build:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            -e PLATFORM='${{ inputs.platform }}' \
            -e TARGET='${{ matrix.target }}' \
            -e TAG='${{ inputs.tag }}' \
            -e BUILD_TOOLS_VERSION='${{ inputs.build_tools_version }}' \
            -e SDK_PLATFORM_APIS='${{ inputs.platform_apis }}' \
            -e NDK_VERSION='${{ inputs.ndk_version }}' \
            -e NDK_REVISION='${{ inputs.ndk_revision }}' \
            -e ROOTDIR=/work \
            "$IMAGE" \
            bash -c 'scripts/fetch-source.sh && scripts/build.sh && scripts/make-sdk.sh'

      - name: Release name
        id: release
        run: |
          version="$(find android-sdk/build-tools -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          test -n "$version"
          echo "name=sdk-$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: "${{ steps.release.outputs.name }}"
          name: "Android SDK · Build Tools ${{ steps.release.outputs.version }}"
          artifacts: ${{ inputs.platform == 'bionic' && matrix.target == 'aarch64-linux-android' && format('{0}/dist/*', github.workspace) || format('{0}/android-sdk-{1}.{2}', github.workspace, matrix.target, inputs.platform == 'windows' && '7z' || 'tar.xz') }}
          allowUpdates: true
          replacesArtifacts: true
          body: ''
