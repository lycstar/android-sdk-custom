name: Repackage Android ARM64 SDK releases
run-name: Repackage Android ARM64 SDK releases
on:
  workflow_dispatch:
    inputs:
      source_release:
        description: "Existing SDK release containing the tools/platforms to repackage"
        required: true
        type: string
      replace_all_releases:
        description: "Migration only: back up, delete all existing releases, then publish the verified replacements"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: migrate-android-sdk-releases
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test packaging and publication
        run: python3 -m unittest discover -s tests -v
      - name: Back up existing releases and verify source
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_REPOSITORY: ${{ github.repository }}
          SOURCE_RELEASE: ${{ inputs.source_release }}
        run: |
          python3 scripts/backup-releases.py --repo "$SDK_REPOSITORY" --dest backup
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path
          tag = os.environ['SOURCE_RELEASE']
          if '/' in tag or tag in ('.', '..'):
              raise ValueError('Invalid source tag')
          source = Path('backup') / tag
          candidates = [source / name for name in ('android-sdk.tar.xz', 'android-sdk-aarch64-linux-android.tar.xz')]
          archive = next(path for path in candidates if path.is_file())
          with tarfile.open(archive) as tar:
              tar.extractall('prepared', filter='data')
          PY
      - name: Save recoverable release backup
        uses: actions/upload-artifact@v4
        with:
          name: previous-releases
          path: backup/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Compile against every Platform
        run: |
          mkdir -p "$RUNNER_TEMP/platform-check"
          echo 'public class PlatformCheck extends android.app.Activity {}' > "$RUNNER_TEMP/platform-check/PlatformCheck.java"
          for platform in prepared/android-sdk/platforms/android-*; do
            javac --release 17 -classpath "$platform/android.jar" -d "$RUNNER_TEMP/platform-check/$(basename "$platform")" "$RUNNER_TEMP/platform-check/PlatformCheck.java"
          done
      - name: Generate and verify separate SDK and Platform releases
        run: |
          python3 scripts/package-sdk.py --sdk prepared/android-sdk --dest dist --target aarch64-linux-android
          python3 scripts/publish-releases.py --dist dist --repo "${{ github.repository }}" --commit "$GITHUB_SHA" --verify-only
      - name: Save all replacement assets before publishing
        uses: actions/upload-artifact@v4
        with:
          name: replacement-releases
          path: dist/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified releases
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_REPOSITORY: ${{ github.repository }}
          REPLACE_ALL: ${{ inputs.replace_all_releases }}
        run: |
          args=()
          if [ "$REPLACE_ALL" = true ]; then args+=(--replace-snapshot backup/releases.json); fi
          python3 scripts/publish-releases.py --dist dist --repo "$SDK_REPOSITORY" --commit "$GITHUB_SHA" "${args[@]}"
